spring.application.name=servicios
server.port=8082

spring.datasource.url=jdbc:mysql://localhost:3306/bd_servicios?createDatabaseIfNotExist=true
spring.config.import=optional:classpath:application-local.properties

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migracion

# ---------- Swagger ----------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operations-sorter=method

# ---------- Eureka (registro de servicios) ----------
# En Docker se define EUREKA_URL=http://eureka-server:8761/eureka/
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
