spring.application.name=usuarios
server.port=8081

# Archivo local con secretos (NO se sube: esta en el .gitignore).
# Copia application-local.properties.example a application-local.properties y completalo.
spring.config.import=optional:classpath:application-local.properties

# ---------- Base de datos (MySQL de Laragon) ----------
# createDatabaseIfNotExist crea bd_usuarios la primera vez.
spring.datasource.url=jdbc:mysql://localhost:3306/bd_usuarios?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=

# ---------- JPA / Hibernate ----------
# update: crea o ajusta la tabla segun la entidad (solo para desarrollo).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# ---------- JWT ----------
# La MISMA clave que usa el microservicio autenticacion. Minimo 32 caracteres.
# Sin valor por defecto a proposito: si falta, el servicio no arranca.
jwt.secret=${JWT_SECRET}

# ---------- Admin inicial ----------
# Si ADMIN_PASSWORD no esta definida, no se crea el admin (nunca hay contrasenas en el repo).
admin.nombre=Administrador
admin.email=${ADMIN_EMAIL:admin@sanmarcos.cl}
admin.password=${ADMIN_PASSWORD:}

# ---------- CORS ----------
cors.allowed-origins=http://localhost:5173

# ---------- Swagger ----------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method

# ---------- Eureka (registro de servicios) ----------
# En Docker se define EUREKA_URL=http://eureka-server:8761/eureka/
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
