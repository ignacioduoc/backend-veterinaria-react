# Veterinaria San Marcos - backend completo
# Levantar todo:   docker compose up --build
# Primero copia .env.example como .env y completa los valores.
#
#   Gateway (entrada del front)  http://localhost:8080     Swagger unificado: /swagger-ui.html
#   Eureka (panel)               http://localhost:8761
#   Swagger de cada microservicio: http://localhost:<puerto>/swagger-ui.html

name: veterinaria

x-ms-comun: &ms-comun
  restart: unless-stopped
  networks: [veterinaria]

services:

  # ============ Eureka ============
  eureka-server:
    build: ./eureka-server
    container_name: eureka-server
    restart: unless-stopped
    ports: ["8761:8761"]
    networks: [veterinaria]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8761/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # ============ API Gateway ============
  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    restart: unless-stopped
    ports: ["8080:8080"]
    networks: [veterinaria]
    environment:
      EUREKA_URL: http://eureka-server:8761/eureka/
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
    depends_on:
      eureka-server: {condition: service_healthy}

  # ============ MySQL (un solo servidor, una base por microservicio) ============
  mysql:
    image: mysql:8.4
    container_name: mysql
    restart: unless-stopped
    networks: [veterinaria]
    ports: ["127.0.0.1:3307:3306"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Define MYSQL_ROOT_PASSWORD en el archivo .env}
    volumes:
      - datos-mysql:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # ============ usuarios ============
  usuarios:
    build: ./usuarios
    container_name: usuarios
    <<: *ms-comun
    ports: ["8081:8081"]
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/bd_usuarios?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=America/Santiago
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      EUREKA_URL: http://eureka-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET (minimo 32 caracteres) en el archivo .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@sanmarcos.cl}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    depends_on:
      mysql: {condition: service_healthy}
      eureka-server: {condition: service_healthy}

  # ============ servicios ============
  servicios:
    build: ./servicios
    container_name: servicios
    <<: *ms-comun
    ports: ["8082:8082"]
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/bd_servicios?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=America/Santiago
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      EUREKA_URL: http://eureka-server:8761/eureka/
    depends_on:
      mysql: {condition: service_healthy}
      eureka-server: {condition: service_healthy}

  # ============ citas ============
  citas:
    build: ./citas
    container_name: citas
    <<: *ms-comun
    ports: ["8083:8083"]
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/bd_citas?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=America/Santiago
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      EUREKA_URL: http://eureka-server:8761/eureka/
    depends_on:
      mysql: {condition: service_healthy}
      eureka-server: {condition: service_healthy}

  # ============ pagos ============
  pagos:
    build: ./pagos
    container_name: pagos
    <<: *ms-comun
    ports: ["8084:8084"]
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/bd_pagos?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=America/Santiago
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      EUREKA_URL: http://eureka-server:8761/eureka/
    depends_on:
      mysql: {condition: service_healthy}
      eureka-server: {condition: service_healthy}

  # ============ mensajeria ============
  mensajeria:
    build: ./mensajeria
    container_name: mensajeria
    <<: *ms-comun
    ports: ["8085:8085"]
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/bd_mensajes?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=America/Santiago
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      EUREKA_URL: http://eureka-server:8761/eureka/
    depends_on:
      mysql: {condition: service_healthy}
      eureka-server: {condition: service_healthy}

  # ============ autenticacion (sin base de datos: consulta a usuarios) ============
  autenticacion:
    build: ./autenticacion
    container_name: autenticacion
    <<: *ms-comun
    ports: ["8086:8086"]
    environment:
      USUARIOS_URL: http://usuarios:8081
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET (minimo 32 caracteres) en el archivo .env}
      EUREKA_URL: http://eureka-server:8761/eureka/
    depends_on:
      usuarios: {condition: service_started}
      eureka-server: {condition: service_healthy}

networks:
  veterinaria:

volumes:
  datos-mysql:
