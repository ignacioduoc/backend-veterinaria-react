spring.application.name=autenticacion
server.port=8086

# Archivo local con secretos (NO se sube: esta en el .gitignore).
# Copia application-local.properties.example a application-local.properties y completalo.
spring.config.import=optional:classpath:application-local.properties

# Este servicio NO tiene base de datos: le pregunta a usuarios por HTTP.
usuarios.url=${USUARIOS_URL:http://localhost:8081}

# ---------- JWT ----------
# La MISMA clave que usa usuarios para verificar los tokens. Minimo 32 caracteres.
# Sin valor por defecto a proposito: si falta, el servicio no arranca.
jwt.secret=${JWT_SECRET}
jwt.expiracion-minutos=60

# ---------- CORS ----------
cors.allowed-origins=http://localhost:5173

# ---------- Swagger ----------
springdoc.swagger-ui.path=/swagger-ui.html
